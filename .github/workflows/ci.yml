name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install minimal deps for tests
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy requests python-docx python-pptx openpyxl lxml pillow

      - name: Run unit tests
        run: python -m pytest tests -q
